<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Nana Hotel Menu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: one narrow column built for phones. A deep green name band, a sticky row of section chips, then menu sections as grouped rows with a small drawn dish on the left and the rupee price on the right. */
:root {
  --bg: #F4F6F1;
  --surface: #FFFFFF;
  --fg: #16241E;
  --muted: #58675F;
  --line: #D9E0D8;
  --brand: #12372D;
  --brand-fg: #F4F6F1;
  --accent: #C8381A;
  --veg: #1B8A3C;
  --nonveg: #B3261E;
  --tile: #EFE8D6;
  --chip: #E6ECE5;
  --chip-on: #12372D;
  --chip-on-fg: #F4F6F1;
  --font-display: "Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
  --font-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1612;
    --surface: #14211B;
    --fg: #E8EFEA;
    --muted: #9BAAA2;
    --line: #25362E;
    --brand: #17483A;
    --brand-fg: #F2F6F3;
    --accent: #FF7452;
    --veg: #3FC066;
    --nonveg: #FF6F62;
    --chip: #1E2E26;
    --chip-on: #E8EFEA;
    --chip-on-fg: #0D1612;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1612;
  --surface: #14211B;
  --fg: #E8EFEA;
  --muted: #9BAAA2;
  --line: #25362E;
  --brand: #17483A;
  --brand-fg: #F2F6F3;
  --accent: #FF7452;
  --veg: #3FC066;
  --nonveg: #FF6F62;
  --chip: #1E2E26;
  --chip-on: #E8EFEA;
  --chip-on-fg: #0D1612;
  color-scheme: dark;
}

body {
  background: var(--bg);
  color: var(--fg);
  font: 400 16px/1.4 var(--font-body);
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--bg);
}
.wrap {
  max-width: 560px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button { font: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Name band */
.band { background: var(--brand); color: var(--brand-fg); }
.head { padding-block: 28px 26px; }
.eyebrow {
  margin: 0 0 8px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  opacity: 0.8;
}
h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(42px, 13vw, 68px);
  line-height: 0.98;
  letter-spacing: -0.02em;
  text-wrap: balance;
}
.sub { margin: 12px 0 0; font-size: 15px; opacity: 0.85; }

/* Sticky section chips */
.bar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.chips {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-block: 10px;
  scrollbar-width: none;
}
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none;
  border: 0;
  border-radius: 999px;
  padding: 8px 14px;
  background: var(--chip);
  color: var(--fg);
  font-size: 14px;
  font-weight: 500;
}

main { padding-block: 18px 12px; }

/* Veg filter */
.seg {
  display: inline-flex;
  gap: 2px;
  padding: 3px;
  border-radius: 999px;
  background: var(--chip);
  margin-bottom: 6px;
}
.seg button {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  border: 0;
  border-radius: 999px;
  padding: 7px 14px;
  background: transparent;
  color: var(--fg);
  font-size: 14px;
  font-weight: 500;
}
.seg button[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-fg); }
.seg .mark { background: #FFFFFF; }

/* Veg / non-veg mark */
.mark {
  flex: none;
  width: 14px;
  height: 14px;
  border: 1.5px solid currentColor;
  border-radius: 3px;
  display: inline-grid;
  place-items: center;
}
.mark::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.mark.veg { color: var(--veg); }
.mark.non { color: var(--nonveg); }

/* Sections */
.sec { margin-top: 22px; scroll-margin-top: calc(64px + env(safe-area-inset-top, 0px)); }
.sec h2 {
  margin: 0 0 10px;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 24px;
  letter-spacing: -0.01em;
  text-wrap: balance;
}
.list {
  list-style: none;
  margin: 0;
  padding: 0 14px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
}
.item {
  display: grid;
  grid-template-columns: 64px minmax(0, 1fr) auto;
  align-items: center;
  gap: 14px;
  padding-block: 12px;
}
.item:not([hidden]) ~ .item:not([hidden]) { border-top: 1px solid var(--line); }
.tile { width: 64px; height: 64px; border-radius: 12px; background: var(--tile); overflow: hidden; }
.tile svg { display: block; width: 100%; height: 100%; }
.info { display: flex; align-items: center; gap: 8px; min-width: 0; }
.name { font-size: 17px; font-weight: 500; line-height: 1.25; overflow-wrap: anywhere; }
.price {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 20px;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.foot { padding-block: 8px 36px; color: var(--muted); font-size: 13px; }
.foot p { margin: 0; }
</style>
</head>
<body>


<header class="band">
  <div class="wrap head">
    <p class="eyebrow">Menu</p>
    <h1>Nana Hotel</h1>
    <p class="sub">All prices in ₹</p>
  </div>
</header>

<nav class="bar" aria-label="Menu sections">
  <div class="wrap"><div class="chips" id="chips"></div></div>
</nav>

<main class="wrap">
  <div class="seg" id="seg" role="group" aria-label="Filter dishes">
    <button type="button" data-f="all" aria-pressed="true">All</button>
    <button type="button" data-f="veg" aria-pressed="false"><span class="mark veg" aria-hidden="true"></span>Veg</button>
    <button type="button" data-f="non" aria-pressed="false"><span class="mark non" aria-hidden="true"></span>Non-veg</button>
  </div>
  <div id="menu"></div>
</main>

<footer class="wrap foot">
  <p>All prices in ₹. Non-veg includes egg dishes.</p>
</footer>

<script>
(function () {
  var CATS = [
    { id: 'rice', title: 'Rice', chip: 'Rice' },
    { id: 'roti', title: 'Roti & Paratha', chip: 'Roti & Paratha' },
    { id: 'snack', title: 'Momo, Noodles & Eggs', chip: 'Momo & Noodles' },
    { id: 'drinks', title: 'Tea & Coffee', chip: 'Tea & Coffee' }
  ];

  var ITEMS = [
    { cat: 'rice', name: 'Veg Rice', price: 150, veg: true, art: 'rice', top: 'veg' },
    { cat: 'rice', name: 'Local Chicken Rice', price: 250, veg: false, art: 'rice', top: 'chicken' },
    { cat: 'rice', name: 'Sukuti Rice', price: 250, veg: false, art: 'rice', top: 'sukuti' },
    { cat: 'rice', name: 'Mutton Rice', price: 300, veg: false, art: 'rice', top: 'mutton' },
    { cat: 'roti', name: 'Roti Sabji', price: 80, veg: true, art: 'rotisabji' },
    { cat: 'roti', name: 'Plain Paratha', price: 100, veg: true, art: 'plain' },
    { cat: 'roti', name: 'Laccha Paratha', price: 100, veg: true, art: 'laccha' },
    { cat: 'roti', name: 'Chicken Roti', price: 180, veg: false, art: 'wrap' },
    { cat: 'snack', name: 'Veg Momo', price: 80, veg: true, art: 'momo' },
    { cat: 'snack', name: 'Wai Wai', price: 80, veg: true, art: 'noodles', bowl: '#D8452B' },
    { cat: 'snack', name: 'Egg Wai Wai', price: 100, veg: false, art: 'noodles', bowl: '#D8452B', egg: true },
    { cat: 'snack', name: 'Maggi', price: 80, veg: true, art: 'noodles', bowl: '#2E8B7A' },
    { cat: 'snack', name: 'Egg Maggi', price: 100, veg: false, art: 'noodles', bowl: '#2E8B7A', egg: true },
    { cat: 'snack', name: 'Omelette', price: 30, veg: false, art: 'omelette' },
    { cat: 'drinks', name: 'Milk Tea', price: 20, veg: true, art: 'cup', liquid: '#C98B52' },
    { cat: 'drinks', name: 'Black Tea', price: 15, veg: true, art: 'cup', liquid: '#A8441F' },
    { cat: 'drinks', name: 'Milk Coffee', price: 50, veg: true, art: 'cup', liquid: '#8A5A3A' },
    { cat: 'drinks', name: 'Black Coffee', price: 30, veg: true, art: 'cup', liquid: '#2B1B14' }
  ];

  var PLATE = '<ellipse cx="32" cy="45" rx="29" ry="11" fill="#FFFFFF" stroke="#CFC6AE" stroke-width="1.5"/>';

  var ART = {
    rice: function (i) {
      var tops = {
        veg: '<circle cx="23" cy="25" r="3" fill="#E8731F"/><circle cx="32" cy="20" r="3" fill="#3FA34D"/><circle cx="41" cy="26" r="3" fill="#E8731F"/><circle cx="28" cy="29" r="2.5" fill="#3FA34D"/><circle cx="37" cy="29" r="2.5" fill="#3FA34D"/>',
        chicken: '<rect x="19" y="20" width="11" height="7" rx="3.5" fill="#A8561F"/><rect x="33" y="21" width="12" height="7" rx="3.5" fill="#8F4519" transform="rotate(-12 39 24)"/><rect x="26" y="27" width="10" height="5" rx="2.5" fill="#B8651F"/><circle cx="43" cy="30" r="2" fill="#3FA34D"/>',
        sukuti: '<path d="M19 24l11 3M30 18l13 4M23 30l15-3M35 29l8 3" stroke="#5A2E16" stroke-width="3.2" stroke-linecap="round" fill="none"/>',
        mutton: '<ellipse cx="24" cy="24" rx="5.5" ry="4.2" fill="#7A2E1B"/><ellipse cx="37" cy="22" rx="6" ry="4.6" fill="#6B2517"/><ellipse cx="31" cy="29" rx="5.5" ry="3.4" fill="#8A3722"/>'
      };
      return '<path d="M9 35h46c0 14-10 21-23 21S9 49 9 35z" fill="#B5472B"/>' +
        '<path d="M12 34c1-14 9-20 20-20s19 6 20 20z" fill="#FFFDF4" stroke="#D8D0BC" stroke-width="1.5"/>' +
        '<rect x="7" y="32" width="50" height="5" rx="2.5" fill="#963A22"/>' + tops[i.top];
    },
    momo: function () {
      var m = function (x, y) {
        return '<g transform="translate(' + x + ' ' + y + ')">' +
          '<path d="M-12 7C-12-7-4-12 0-12S12-7 12 7Z" fill="#F8F1E1" stroke="#CDBF9F" stroke-width="1.5" stroke-linejoin="round"/>' +
          '<path d="M-6-8l1.5 13M0-10v15M6-8l-1.5 13" stroke="#CDBF9F" stroke-width="1.1" stroke-linecap="round" fill="none"/></g>';
      };
      return PLATE + m(32, 34) + m(19, 44) + m(45, 44);
    },
    rotisabji: function () {
      return '<circle cx="26" cy="33" r="19" fill="#E4B565" stroke="#C58B3E" stroke-width="2"/>' +
        '<circle cx="20" cy="27" r="2" fill="#B97A38"/><circle cx="31" cy="38" r="2" fill="#B97A38"/><circle cx="23" cy="42" r="2" fill="#B97A38"/><circle cx="33" cy="26" r="2" fill="#B97A38"/>' +
        '<path d="M36 38h24c0 9-5 14-12 14s-12-5-12-14z" fill="#B5472B"/>' +
        '<ellipse cx="48" cy="38" rx="12" ry="3.5" fill="#E8731F"/>' +
        '<circle cx="43" cy="37.5" r="1.7" fill="#3FA34D"/><circle cx="49" cy="38.5" r="1.7" fill="#3FA34D"/><circle cx="54" cy="37.5" r="1.5" fill="#F4C542"/>';
    },
    plain: function () {
      return '<path d="M32 9L57 50Q59 55 53 55H11Q5 55 7 50Z" fill="#E7B966" stroke="#C58B3E" stroke-width="2" stroke-linejoin="round"/>' +
        '<path d="M32 20V48M24 36l8-6M40 36l-8-6" stroke="#C58B3E" stroke-width="1.5" stroke-linecap="round" fill="none"/>' +
        '<circle cx="22" cy="46" r="1.8" fill="#B97A38"/><circle cx="42" cy="47" r="1.8" fill="#B97A38"/><circle cx="32" cy="42" r="1.8" fill="#B97A38"/>';
    },
    laccha: function () {
      return '<circle cx="32" cy="32" r="24" fill="#E9BD6A" stroke="#C58B3E" stroke-width="2"/>' +
        '<circle cx="32" cy="32" r="18" fill="none" stroke="#C58B3E" stroke-width="1.6" stroke-dasharray="7 3"/>' +
        '<circle cx="32" cy="32" r="11.5" fill="none" stroke="#C58B3E" stroke-width="1.6" stroke-dasharray="5 3"/>' +
        '<circle cx="32" cy="32" r="5" fill="none" stroke="#C58B3E" stroke-width="1.6"/>' +
        '<ellipse cx="22" cy="18" rx="5" ry="2.2" fill="#FFF3CF" opacity=".6" transform="rotate(-35 22 18)"/>';
    },
    wrap: function () {
      return '<g transform="rotate(-18 32 34)">' +
        '<rect x="6" y="24" width="52" height="20" rx="10" fill="#E4B565" stroke="#C58B3E" stroke-width="1.5"/>' +
        '<path d="M20 25v18M32 25v18" stroke="#C58B3E" stroke-width="1.2" opacity=".55"/>' +
        '<ellipse cx="53" cy="34" rx="5" ry="9" fill="#8A4B24"/>' +
        '<circle cx="53" cy="30" r="2" fill="#6AB04C"/><circle cx="53" cy="37" r="2" fill="#C94A4A"/>' +
        '</g>';
    },
    noodles: function (i) {
      var egg = i.egg
        ? '<path d="M26 18c-6 0-11 4-10 9 1 5 8 6 14 5 7-1 12-5 10-10-2-5-8-6-14-4z" fill="#FFFFFF" stroke="#E4DFD0" stroke-width="1.2"/><circle cx="31" cy="24" r="5" fill="#F4A31B"/>'
        : '<circle cx="24" cy="21" r="1.8" fill="#3FA34D"/><circle cx="35" cy="19" r="1.8" fill="#3FA34D"/><circle cx="42" cy="25" r="1.8" fill="#3FA34D"/>';
      return '<path d="M8 35h48c0 14-10 21-24 21S8 49 8 35z" fill="' + i.bowl + '"/>' +
        '<path d="M11 34c2-12 10-18 21-18s19 6 21 18z" fill="#F1C24C"/>' +
        '<path d="M15 30c4-5 7 5 11 0s7 5 11 0 7 5 11 0M18 24c4-4 6 4 10 0s6 4 10 0 6 4 8 0" stroke="#CE9419" stroke-width="2.2" stroke-linecap="round" fill="none"/>' +
        egg +
        '<rect x="6" y="32" width="52" height="5" rx="2.5" fill="' + i.bowl + '"/><rect x="6" y="32" width="52" height="5" rx="2.5" fill="#000" opacity=".15"/>';
    },
    cup: function (i) {
      return '<ellipse cx="31" cy="51" rx="24" ry="6" fill="#FFFFFF" stroke="#CFC6AE" stroke-width="1.5"/>' +
        '<path d="M49 30h3a6 6 0 0 1 0 12h-5" fill="none" stroke="#CFC6AE" stroke-width="3.5" stroke-linecap="round"/>' +
        '<path d="M13 27h36v8c0 10-7 16-18 16S13 45 13 35z" fill="#FFFFFF" stroke="#CFC6AE" stroke-width="1.5" stroke-linejoin="round"/>' +
        '<ellipse cx="31" cy="28" rx="17" ry="3.2" fill="' + i.liquid + '"/>' +
        '<path d="M23 21c-3-3 3-5 0-9M31 21c-3-3 3-5 0-9M39 21c-3-3 3-5 0-9" stroke="#B9AE95" stroke-width="2" stroke-linecap="round" fill="none"/>';
    },
    omelette: function () {
      return PLATE +
        '<path d="M9 40C9 26 19 20 32 20s23 6 23 20c0 5-8 8-23 8S9 45 9 40z" fill="#F6D24F" stroke="#D9A92A" stroke-width="1.5"/>' +
        '<path d="M13 40c10 5 28 5 38 0" stroke="#D9A92A" stroke-width="1.5" fill="none"/>' +
        '<rect x="22" y="29" width="4" height="2" rx="1" fill="#3FA34D" transform="rotate(20 24 30)"/><rect x="36" y="27" width="4" height="2" rx="1" fill="#3FA34D" transform="rotate(-25 38 28)"/><rect x="30" y="34" width="4" height="2" rx="1" fill="#3FA34D"/><circle cx="43" cy="34" r="1.5" fill="#D6401F"/><circle cx="19" cy="35" r="1.5" fill="#D6401F"/>';
    }
  };

  function drawing(item) {
    return '<svg viewBox="0 0 64 64" aria-hidden="true" focusable="false">' + ART[item.art](item) + '</svg>';
  }

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
  }

  var menu = document.getElementById('menu');
  var chips = document.getElementById('chips');

  CATS.forEach(function (c) {
    var rows = ITEMS.filter(function (i) { return i.cat === c.id; }).map(function (i) {
      return '<li class="item" data-veg="' + (i.veg ? '1' : '0') + '">' +
        '<div class="tile">' + drawing(i) + '</div>' +
        '<div class="info"><span class="mark ' + (i.veg ? 'veg' : 'non') + '" role="img" aria-label="' + (i.veg ? 'Vegetarian' : 'Non-vegetarian') + '"></span>' +
        '<span class="name">' + esc(i.name) + '</span></div>' +
        '<span class="price">₹' + i.price + '</span></li>';
    }).join('');
    menu.insertAdjacentHTML('beforeend',
      '<section class="sec" id="sec-' + c.id + '"><h2>' + esc(c.title) + '</h2><ul class="list">' + rows + '</ul></section>');
    chips.insertAdjacentHTML('beforeend',
      '<button type="button" class="chip" data-target="sec-' + c.id + '">' + esc(c.chip) + '</button>');
  });

  var filter = 'all';

  function apply() {
    document.querySelectorAll('.item').forEach(function (li) {
      var v = li.dataset.veg === '1';
      li.hidden = (filter === 'veg' && !v) || (filter === 'non' && v);
    });
    document.querySelectorAll('.sec').forEach(function (s) {
      s.hidden = !s.querySelector('.item:not([hidden])');
    });
    document.querySelectorAll('.chip').forEach(function (c) {
      c.hidden = document.getElementById(c.dataset.target).hidden;
    });
    document.querySelectorAll('#seg button').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.f === filter));
    });
  }

  document.getElementById('seg').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    filter = b.dataset.f;
    apply();
  });

  chips.addEventListener('click', function (e) {
    var b = e.target.closest('.chip');
    if (!b) return;
    var calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    document.getElementById(b.dataset.target).scrollIntoView({ behavior: calm ? 'auto' : 'smooth', block: 'start' });
  });

  apply();
})();
</script>

</body>
</html>
